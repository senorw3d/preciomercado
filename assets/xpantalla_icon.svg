<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" fill="none">
  <defs>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080e18"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card with YELLOW border -->
  <rect x="2" y="2" width="40" height="40" rx="9" fill="url(#bgGrad)" stroke="#facc15" stroke-width="2.2" filter="url(#glow-yellow)"/>

  <!-- Spread central axis (blue tech line) -->
  <line x1="22" y1="7" x2="22" y2="37" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="2 1.5" opacity="0.85"/>

  <!-- Left: COMPRA / BID (Neon Green depth bars) -->
  <rect x="16" y="9.5" width="4.5" height="2.5" rx="1" fill="#10b981" filter="url(#glow)"/>
  <rect x="13" y="14" width="7.5" height="2.5" rx="1" fill="#10b981" filter="url(#glow)"/>
  <rect x="10" y="18.5" width="10.5" height="2.5" rx="1" fill="#10b981" filter="url(#glow)"/>
  <rect x="7" y="23" width="13.5" height="2.5" rx="1" fill="#10b981" filter="url(#glow)"/>
  <rect x="5.5" y="27.5" width="15" height="2.5" rx="1" fill="#10b981" filter="url(#glow)"/>
  <rect x="8" y="32" width="12.5" height="2.5" rx="1" fill="#10b981" filter="url(#glow)"/>

  <!-- Right: VENTA / ASK (Neon Rose/Red depth bars) -->
  <rect x="23.5" y="9.5" width="15" height="2.5" rx="1" fill="#f43f5e" filter="url(#glow)"/>
  <rect x="23.5" y="14" width="12.5" height="2.5" rx="1" fill="#f43f5e" filter="url(#glow)"/>
  <rect x="23.5" y="18.5" width="10.5" height="2.5" rx="1" fill="#f43f5e" filter="url(#glow)"/>
  <rect x="23.5" y="23" width="7.5" height="2.5" rx="1" fill="#f43f5e" filter="url(#glow)"/>
  <rect x="23.5" y="27.5" width="5.5" height="2.5" rx="1" fill="#f43f5e" filter="url(#glow)"/>
  <rect x="23.5" y="32" width="9" height="2.5" rx="1" fill="#f43f5e" filter="url(#glow)"/>

  <!-- Mini baseline -->
  <line x1="6" y1="36.5" x2="38" y2="36.5" stroke="#1e293b" stroke-width="1"/>
</svg>
